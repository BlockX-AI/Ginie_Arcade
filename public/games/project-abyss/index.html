<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Project Abyss-Engine</title>
  <script src="/games/ginix-bridge.js"></script>
  <script src="/runtime.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    canvas { display: block; touch-action: none; }
    #mobile-ui {
      position: absolute; inset: 0; pointer-events: none;
      display: none; z-index: 1000;
    }
    @media (pointer: coarse) {
      #mobile-ui { display: block; }
    }
    .joystick-base {
      position: absolute; bottom: 30px; left: 30px;
      width: 120px; height: 120px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      pointer-events: auto;
      touch-action: none;
    }
    .joystick-stick {
      position: absolute; top: 28px; left: 28px;
      width: 60px; height: 60px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      pointer-events: none;
    }
    .actions {
      position: absolute; bottom: 20px; right: 20px;
      width: 180px; height: 180px; pointer-events: auto;
    }
    .mbtn {
      background: rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.4);
      border-radius: 50%; color: white; font-weight: bold; font-family: sans-serif;
      display: flex; align-items: center; justify-content: center;
      user-select: none; touch-action: none; position: absolute;
    }
    .mbtn:active { background: rgba(0,0,0,0.6); }
    /* Removed dpad styles */

    .mbtn-act { width: 55px; height: 55px; font-size: 11px; }
    .mbtn-fire { bottom: 0; right: 65px; }
    .mbtn-heavy { bottom: 65px; right: 0; }
    .mbtn-boost { bottom: 65px; right: 65px; }
    .mbtn-o2 { bottom: 130px; right: 30px; width: 45px; height: 45px; }
    .mbtn-bat { bottom: 30px; right: 130px; width: 45px; height: 45px; }
  </style>
</head>
<body>
  <div id="mobile-ui">
    <div class="joystick-base" id="joystick-base">
      <div class="joystick-stick" id="joystick-stick"></div>
    </div>
    <div class="actions">
      <div class="mbtn mbtn-act mbtn-fire" id="btn-fire">FIRE</div>
      <div class="mbtn mbtn-act mbtn-heavy" id="btn-heavy">HEAVY</div>
      <div class="mbtn mbtn-act mbtn-boost" id="btn-boost">BOOST</div>
      <div class="mbtn mbtn-act mbtn-o2" id="btn-o2">+O2</div>
      <div class="mbtn mbtn-act mbtn-bat" id="btn-bat">+BAT</div>
    </div>
  </div>

  <script>
    window.mobileInputs = { up: false, down: false, left: false, right: false };
    
    const bindBtn = (id, downCb, upCb) => {
      const el = document.getElementById(id);
      if(!el) return;
      el.addEventListener('pointerdown', (e) => { e.preventDefault(); downCb(); });
      el.addEventListener('pointerup', (e) => { e.preventDefault(); if(upCb) upCb(); });
      el.addEventListener('pointerout', (e) => { e.preventDefault(); if(upCb) upCb(); });
    };

    document.addEventListener('DOMContentLoaded', () => {
      const base = document.getElementById('joystick-base');
      const stick = document.getElementById('joystick-stick');
      let jDrag = false;
      let jId = null;
      const maxDist = 40;
      const center = { x: 60, y: 60 };

      const updateJoystick = (e) => {
        if (!jDrag || e.pointerId !== jId) return;
        const rect = base.getBoundingClientRect();
        let dx = e.clientX - rect.left - center.x;
        let dy = e.clientY - rect.top - center.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist > maxDist) {
          dx = (dx / dist) * maxDist;
          dy = (dy / dist) * maxDist;
        }
        stick.style.transform = `translate(${dx}px, ${dy}px)`;
        
        const thresh = 15;
        window.mobileInputs.left = dx < -thresh;
        window.mobileInputs.right = dx > thresh;
        window.mobileInputs.up = dy < -thresh;
        window.mobileInputs.down = dy > thresh;
      };

      const resetJoystick = (e) => {
        if (e && e.pointerId !== jId) return;
        jDrag = false;
        jId = null;
        stick.style.transform = `translate(0px, 0px)`;
        window.mobileInputs.left = false;
        window.mobileInputs.right = false;
        window.mobileInputs.up = false;
        window.mobileInputs.down = false;
      };

      base.addEventListener('pointerdown', (e) => {
        if (jDrag) return;
        jDrag = true;
        jId = e.pointerId;
        base.setPointerCapture(jId);
        updateJoystick(e);
      });
      base.addEventListener('pointermove', updateJoystick);
      base.addEventListener('pointerup', resetJoystick);
      base.addEventListener('pointercancel', resetJoystick);
      
      bindBtn('btn-fire', () => { if(window.doAttack) window.doAttack(); });
      bindBtn('btn-heavy', () => { if(window.doHeavy) window.doHeavy(); });
      bindBtn('btn-boost', () => { if(window.doBoost) window.doBoost(); });
      bindBtn('btn-o2', () => { if(window.doO2) window.doO2(); });
      bindBtn('btn-bat', () => { if(window.doBat) window.doBat(); });
    });
  </script>
<script src="constants.js"></script>
<script src="BootScene.js"></script>
<script src="MenuScene.js"></script>
<script src="GameScene.js"></script>
<script src="HUDScene.js"></script>
<script src="SettingsScene.js"></script>
<script src="GameOverScene.js"></script>
<script>
  const config = {
    type: Phaser.AUTO,
    width: 960,
    height: 540,
    backgroundColor: '#000010',
    parent: document.body,
    scale: {
      mode: Phaser.Scale.FIT,
      autoCenter: Phaser.Scale.CENTER_BOTH
    },
    physics: {
      default: 'arcade',
      arcade: { gravity: { y: 0 }, debug: false }
    },
    scene: [BootScene, MenuScene, GameScene, HUDScene, SettingsScene, GameOverScene]
  };
  window._game = new Phaser.Game(config);
</script>
</body>
</html>
